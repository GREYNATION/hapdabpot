<!DOCTYPE html>
<html>
<head>
    <title>HAPDA_BOT // FINAL WORKING</title>
    <style>
        body { background:#050505; color:#0ff; font-family:monospace; margin:0; padding:0; overflow:hidden; }
        #avatar { width:220px; height:220px; margin:40px auto; border-radius:50%; border:3px solid #0ff; box-shadow:0 0 40px #0ff; }
        #chat { height:380px; overflow-y:auto; padding:20px; background:rgba(0,0,0,0.7); }
        .hap { color:#fff; margin:8px 0; }
        .bot { color:#0ff; margin:8px 0; }
        input { width:75%; background:#000; border:1px solid #0ff; color:#0ff; padding:12px; font-size:16px; }
        button { background:#0ff; color:#000; border:none; padding:12px 20px; font-weight:bold; cursor:pointer; }
    </style>
</head>
<body>
    <center>
        <h1>HAPDA_BOT</h1>
        <img id="avatar" src="https://i.imgur.com/2fY9v8s.png" alt="Jarvis">
        <div id="chat"></div>
        <input type="text" id="input" placeholder="Type: click 500 500 or type Hello..." autofocus>
        <button onclick="send()">SEND</button>
    </center>

    <script>
        const chat = document.getElementById("chat");
        
        function addMessage(text, who) {
            chat.innerHTML += `<div class="${who}"><b>${who.toUpperCase()}:</b> ${text}</div>`;
            chat.scrollTop = chat.scrollHeight;
        }

        async function executeHands(text) {
            const lower = text.toLowerCase();
            const nums = text.match(/\d+/g);
            
            try {
                if (lower.includes("click") && nums && nums.length >= 2) {
                    await fetch("http://localhost:3300/hands/click", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({x: parseInt(nums[0]), y: parseInt(nums[1])})
                    });
                    addMessage(`Click executed at ${nums[0]}, ${nums[1]}`, "bot");
                }
                else if (lower.startsWith("type ")) {
                    await fetch("http://localhost:3300/hands/type", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({text: text.substring(5)})
                    });
                    addMessage(`Typed: ${text.substring(5)}`, "bot");
                }
                else {
                    addMessage("Command received but not recognized as mouse/keyboard action.", "bot");
                }
            } catch(e) {
                addMessage("ERROR: Gravity-Claw agent is not running on port 3300", "bot");
            }
        }

        async function send() {
            const input = document.getElementById("input");
            const text = input.value.trim();
            if (!text) return;
            
            addMessage(text, "hap");
            
            // FORCE LOCAL EXECUTION FIRST
            if (/click|type |move/i.test(text)) {
                await executeHands(text);
            } else {
                addMessage("Understood. Awaiting hardware command or analysis request.", "bot");
            }
            
            input.value = "";
        }

        // Allow pressing Enter
        document.getElementById("input").addEventListener("keypress", function(e) {
            if (e.key === "Enter") send();
        });

        // Welcome message
        addMessage("System online. Gravity-Claw local agent connected. Ready for mouse and keyboard control.", "bot");
    </script>
</body>
</html>
