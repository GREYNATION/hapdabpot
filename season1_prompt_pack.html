<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spidey Jr. — Season 1 Full Prompt Pack</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #FF2D2D; --blue: #1A3FCC; --yellow: #FFD600;
    --sky: #5BC8FF; --green: #3DDC84; --orange: #FF8C42;
    --pink: #FF6B9D; --purple: #9B59FF; --teal: #00CEC9;
    --dark: #0D1B4B; --soft: #FFF8F0; --white: #FFFDF5;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Nunito', sans-serif;
    background: #0D1B4B;
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* STAR BG */
  .stars {
    position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(ellipse at 20% 10%, #1A2B6B 0%, #0D1B4B 60%, #080F2E 100%);
    overflow: hidden;
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle {
    0%,100%{opacity:0.2;transform:scale(1)}
    50%{opacity:1;transform:scale(1.3)}
  }

  /* WEB PATTERN */
  .web-pattern {
    position: fixed; top: -80px; left: -80px;
    width: 500px; height: 500px;
    opacity: 0.04; z-index: 0; pointer-events: none;
  }

  /* HEADER */
  .header {
    position: relative; z-index: 1;
    text-align: center;
    padding: 48px 24px 36px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .season-badge {
    display: inline-flex; align-items: center; gap: 10px;
    background: linear-gradient(135deg, var(--red), #FF6B2B);
    border-radius: 50px;
    padding: 8px 24px;
    margin-bottom: 18px;
    font-family: 'Baloo 2', cursive;
    font-weight: 900; font-size: 0.9rem;
    letter-spacing: 1px;
    box-shadow: 0 4px 20px rgba(255,45,45,0.4);
    animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes popIn {
    0%{transform:scale(0) rotate(-5deg);opacity:0}
    100%{transform:scale(1) rotate(0);opacity:1}
  }
  .header h1 {
    font-family: 'Baloo 2', cursive;
    font-size: clamp(2.2rem,6vw,4rem);
    font-weight: 900; line-height: 1.1;
    animation: slideUp 0.6s 0.1s both;
  }
  .header h1 em { color: var(--yellow); font-style: normal; }
  @keyframes slideUp {
    0%{transform:translateY(30px);opacity:0}
    100%{transform:translateY(0);opacity:1}
  }
  .header p {
    margin-top: 10px; font-size: 1rem; font-weight: 600;
    color: rgba(255,255,255,0.5);
    animation: slideUp 0.6s 0.2s both;
  }

  /* STATS ROW */
  .stats-row {
    display: flex; justify-content: center;
    gap: 14px; flex-wrap: wrap;
    margin-top: 24px;
    animation: slideUp 0.6s 0.3s both;
  }
  .stat-chip {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 50px;
    padding: 7px 18px;
    font-weight: 700; font-size: 0.82rem;
    color: rgba(255,255,255,0.8);
    backdrop-filter: blur(8px);
  }

  /* COPY ALL BTN */
  .copy-all-wrap {
    position: relative; z-index: 1;
    text-align: center;
    padding: 28px 20px 0;
  }
  .copy-all-btn {
    background: linear-gradient(135deg, var(--yellow), var(--orange));
    color: var(--dark);
    border: none; border-radius: 50px;
    padding: 16px 40px;
    font-family: 'Baloo 2', cursive;
    font-size: 1.1rem; font-weight: 900;
    cursor: pointer;
    box-shadow: 0 8px 28px rgba(255,214,0,0.35);
    transition: transform 0.2s, box-shadow 0.2s;
    letter-spacing: 0.3px;
  }
  .copy-all-btn:hover { transform: scale(1.05) translateY(-2px); box-shadow: 0 12px 36px rgba(255,214,0,0.45); }

  /* EPISODE GRID */
  .ep-grid {
    position: relative; z-index: 1;
    max-width: 1100px; margin: 0 auto;
    padding: 32px 20px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
    gap: 20px;
  }
  @media(max-width:560px){ .ep-grid { grid-template-columns: 1fr; } }

  .ep-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    padding: 26px;
    transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
    animation: cardIn 0.5s both;
    backdrop-filter: blur(10px);
  }
  .ep-card:hover {
    transform: translateY(-4px);
    border-color: rgba(255,255,255,0.2);
    box-shadow: 0 16px 48px rgba(0,0,0,0.4);
  }
  .ep-card:nth-child(1){animation-delay:0.05s} .ep-card:nth-child(2){animation-delay:0.1s}
  .ep-card:nth-child(3){animation-delay:0.15s} .ep-card:nth-child(4){animation-delay:0.2s}
  .ep-card:nth-child(5){animation-delay:0.25s} .ep-card:nth-child(6){animation-delay:0.3s}
  .ep-card:nth-child(7){animation-delay:0.35s} .ep-card:nth-child(8){animation-delay:0.4s}
  @keyframes cardIn {
    0%{opacity:0;transform:translateY(24px)} 100%{opacity:1;transform:translateY(0)}
  }

  /* EP CARD TOP */
  .ep-top {
    display: flex; align-items: flex-start;
    gap: 16px; margin-bottom: 18px;
  }
  .ep-num-badge {
    width: 52px; height: 52px; border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Baloo 2', cursive;
    font-size: 1.2rem; font-weight: 900;
    flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .ep-meta { flex: 1; }
  .ep-title {
    font-family: 'Baloo 2', cursive;
    font-size: 1.1rem; font-weight: 900;
    line-height: 1.2; margin-bottom: 4px;
  }
  .ep-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .ep-tag {
    background: rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 2px 9px;
    font-size: 0.68rem; font-weight: 700;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase; letter-spacing: 0.5px;
  }

  /* PROMPT BOX */
  .prompt-box {
    background: rgba(0,0,0,0.25);
    border-radius: 14px;
    padding: 16px;
    border: 1px solid rgba(255,255,255,0.06);
    font-size: 0.8rem;
    line-height: 1.65;
    color: rgba(255,255,255,0.75);
    margin-bottom: 14px;
    max-height: 130px;
    overflow: hidden;
    position: relative;
    transition: max-height 0.4s ease;
  }
  .prompt-box.expanded { max-height: 600px; }
  .prompt-fade {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 40px;
    background: linear-gradient(0deg, rgba(13,5,30,0.9), transparent);
    border-radius: 0 0 14px 14px;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .prompt-box.expanded .prompt-fade { opacity: 0; }

  /* ACTIONS */
  .ep-actions { display: flex; gap: 8px; }
  .btn-expand {
    flex: 1;
    background: rgba(255,255,255,0.07);
    color: rgba(255,255,255,0.7);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 9px 16px;
    font-family: 'Baloo 2', cursive;
    font-weight: 700; font-size: 0.82rem;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .btn-expand:hover { background: rgba(255,255,255,0.12); color: white; }
  .btn-copy-ep {
    flex: 2;
    border: none; border-radius: 12px;
    padding: 9px 20px;
    font-family: 'Baloo 2', cursive;
    font-weight: 800; font-size: 0.88rem;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    color: var(--dark);
  }
  .btn-copy-ep:hover { transform: scale(1.04); }
  .btn-copy-ep.copied {
    background: var(--green) !important;
    color: white !important;
  }

  /* PLATFORM SPECS STRIP */
  .spec-strip {
    display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap;
  }
  .spec-bit {
    background: rgba(255,255,255,0.05);
    border-radius: 8px; padding: 4px 10px;
    font-size: 0.68rem; font-weight: 700;
    color: rgba(255,255,255,0.45);
  }

  /* FOOTER */
  .footer {
    position: relative; z-index: 1;
    text-align: center; padding: 0 20px 40px;
    font-size: 0.8rem; font-weight: 600;
    color: rgba(255,255,255,0.25);
  }
  .footer span { color: var(--yellow); }

  /* TOAST */
  .toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--green); color: white;
    border-radius: 50px; padding: 12px 28px;
    font-family: 'Baloo 2', cursive;
    font-weight: 800; font-size: 0.95rem;
    opacity: 0; transition: all 0.3s;
    z-index: 999;
    box-shadow: 0 6px 24px rgba(61,220,132,0.5);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<svg class="web-pattern" viewBox="0 0 400 400" fill="none">
  <circle cx="200" cy="200" r="190" stroke="white" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="140" stroke="white" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="90" stroke="white" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="40" stroke="white" stroke-width="1.5"/>
  <line x1="200" y1="10" x2="200" y2="390" stroke="white" stroke-width="1.2"/>
  <line x1="10" y1="200" x2="390" y2="200" stroke="white" stroke-width="1.2"/>
  <line x1="66" y1="66" x2="334" y2="334" stroke="white" stroke-width="1"/>
  <line x1="334" y1="66" x2="66" y2="334" stroke="white" stroke-width="1"/>
  <line x1="10" y1="122" x2="390" y2="278" stroke="white" stroke-width="0.7"/>
  <line x1="10" y1="278" x2="390" y2="122" stroke="white" stroke-width="0.7"/>
  <line x1="122" y1="10" x2="278" y2="390" stroke="white" stroke-width="0.7"/>
  <line x1="278" y1="10" x2="122" y2="390" stroke="white" stroke-width="0.7"/>
</svg>

<div class="header">
  <div class="season-badge">🕷️ SPIDEY JR. STUDIOS · SEASON 1</div>
  <h1>8-Episode <em>Veo 3.1</em><br>Prompt Pack</h1>
  <p>Ready-to-paste prompts · Optimized for kids YouTube Shorts · 9:16 · 720p · 30s</p>
  <div class="stats-row">
    <div class="stat-chip">🎬 8 Episodes</div>
    <div class="stat-chip">📐 9:16 · 720p</div>
    <div class="stat-chip">⏱ 30 Seconds Each</div>
    <div class="stat-chip">🎨 Pixar-Style 3D</div>
    <div class="stat-chip">🔊 No Dialogue</div>
    <div class="stat-chip">👶 Ages 2–7</div>
  </div>
</div>

<div class="copy-all-wrap">
  <button class="copy-all-btn" onclick="copyAll()">⚡ Copy All 8 Prompts at Once</button>
</div>

<div class="ep-grid" id="epGrid"></div>

<div class="footer">
  <span>GREYNATION</span> · Spidey Jr. Studios · Season 1 Production Pack 🕷️
</div>

<div class="toast" id="toast"></div>

<script>
// STARS
const starsEl = document.getElementById('stars');
for(let i=0;i<120;i++){
  const s = document.createElement('div');
  s.className='star';
  const size = 1+Math.random()*2.5;
  s.style.cssText=`width:${size}px;height:${size}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*5}s;`;
  starsEl.appendChild(s);
}

// EPISODE DATA
const episodes = [
  {
    num:'01', emoji:'🌅', title:'First Swing!',
    theme:'Origin Story', mood:'Wonder & Joy',
    color1:'#FF2D2D', color2:'#FF6B2B',
    tags:['origin','playground','web-swinging','surprise'],
    prompt:`A playful childlike version of Spider-Man kid, Pixar-style high-quality 3D animation, stands in a bright whimsical urban playground surrounded by vivid rainbow-colored jungle gyms and lush greenery. He accidentally shoots a tiny glimmering web strand from his wrist for the very first time — his enormous round expressive eyes go wide with pure joy and disbelief. Saturated vivid colors: electric red suit, cobalt blue accents, lemon yellow sunshine, mint green grass. Soft warm golden-hour sunlight rakes across the scene creating gentle lens flares. Camera starts with a sweeping wide establishing shot of the magical colorful playground, then dollies smoothly in to a tight close-up of the hero's beaming face, freckles, and gigantic sparkling eyes. Smooth fluid motion at high frame rate, dynamic web strand physics with sparkle trail. Heartwarming energetic kids animation tone. 9:16 portrait format, 720p, 30 seconds, no dialogue, no text overlays.`
  },
  {
    num:'02', emoji:'🦋', title:'Butterfly Rescue',
    theme:'Kindness', mood:'Gentle & Warm',
    color1:'#FF6B9D', color2:'#9B59FF',
    tags:['kindness','nature','rescue','empathy'],
    prompt:`Adorable Spider-Man kid character, Pixar-style 3D animation, tiptoes gently toward a tiny glowing butterfly whose wings are caught in a dewy spiderweb in a magical garden. With the softest touch, he carefully spins a tiny new silken thread to free the butterfly, which then lands on his nose causing him to giggle with crossed eyes. Lush oversized flowers in vivid pinks, purples, and yellows tower around the characters. Soft diffused sunlight with god-rays through flower petals creates a warm dreamy atmosphere. Macro close-up of iridescent butterfly wings, then wide shot of the cheerful garden setting. Character has impossibly big warm brown eyes radiating gentleness. Fluid organic motion, butterfly wing physics, petals drifting. Heartwarming tender tone. 9:16 portrait, 720p, 30 seconds, no dialogue.`
  },
  {
    num:'03', emoji:'🎈', title:'Birthday Surprise',
    theme:'Friendship', mood:'Celebration',
    color1:'#FFD600', color2:'#FF8C42',
    tags:['birthday','friendship','celebration','gift'],
    prompt:`Cheerful Spider-Man kid swings through a vibrant candy-colored city skyline carrying an enormous birthday gift box wrapped in red-and-blue polka-dot paper with a huge golden bow, confetti explosions bursting behind him with every swing. Buildings have rounded cartoon edges painted in pastel stripes with birthday banners and floating balloons in every color. Warm saturated late-afternoon light turns everything golden. Dynamic action sequence: wide shot of the city swing arc, medium shot showing the determined joyful expression, landing shot where the gift is delivered to a tiny child whose jaw drops in amazement. Confetti physics, ribbon flutter, web-swing momentum all rendered with fluid high-frame-rate motion. Pure celebratory energy. 9:16 portrait, 720p, 30 seconds, no dialogue.`
  },
  {
    num:'04', emoji:'🌧️', title:'Rainy Day Hero',
    theme:'Empathy', mood:'Cozy & Warm',
    color1:'#5BC8FF', color2:'#1A3FCC',
    tags:['rain','helping','empathy','cozy'],
    prompt:`Spider-Man kid cheerfully swings through a warm rainy city evening holding an enormous rainbow-striped umbrella, rain droplets catching all the neon reflections from glowing shopfront windows below. He spots a tiny yellow duckling stranded on a flooded cobblestone corner and swoops down gently, lifting it to safety on a dry flower pot ledge. Wet streets mirror the vivid colorful city lights creating a magical kaleidoscope effect on the ground. Character's big expressive eyes show sincere concern then bloom into relief and happiness. Rain particle effects catching colored light, umbrella canvas rippling, water splash physics. Close-up of the duckling looking up grateful, then wide shot of the glowing rainy city. Cozy heartwarming tone despite the rain. 9:16 portrait, 720p, 30 seconds, no dialogue.`
  },
  {
    num:'05', emoji:'🐶', title:'Lost Puppy',
    theme:'Responsibility', mood:'Heartwarming',
    color1:'#3DDC84', color2:'#00CEC9',
    tags:['animals','responsibility','reunion','community'],
    prompt:`Spider-Man kid carefully cradles a tiny fluffy golden retriever puppy in his arms while swinging low through a bright flower-lined neighborhood street, stopping to post hand-drawn FOUND! signs made from tiny webs on rainbow-painted garden walls. The puppy licks his masked cheek repeatedly causing him to wobble mid-swing laughing. Street has oversized sunflowers, colorful mailboxes, friendly illustrated storefronts in warm afternoon light. Final scene: the puppy reunites with a small toddler in a sun-drenched front yard — both spin in circles with joy as Spider-Kid watches from a rooftop with a warm smile. Puppy fur simulation, web-sign flutter, warm backlit haze on reunion scene. 9:16 portrait, 720p, 30 seconds, no dialogue.`
  },
  {
    num:'06', emoji:'🌈', title:'Rainbow After Rain',
    theme:'Hope & Wonder', mood:'Magical',
    color1:'#9B59FF', color2:'#FF6B9D',
    tags:['rainbow','wonder','magic','neighborhood'],
    prompt:`Spider-Man kid sits perched on the highest rooftop of a whimsical illustrated city, chin resting on his hands, watching the most spectacular massive rainbow arc emerge after a rainstorm. Puddles on every street below reflect the rainbow's colors turning the whole world into a mirror of light. He reaches out one tiny gloved hand toward the rainbow as if trying to touch it — big eyes shimmering with awe. Then he gets an idea: he shoots a web strand from one rainbow end to the other and slides across it like a zip line, leaving a trail of colorful sparkles. City buildings are rounded pastel-painted towers with flower box windows and tiny lit interiors visible. Magical lighting, volumetric rainbow god-rays, sparkle physics. Pure wonder and delight. 9:16 portrait, 720p, 30 seconds, no dialogue.`
  },
  {
    num:'07', emoji:'🍎', title:'Lunch Hero',
    theme:'Sharing', mood:'Funny & Sweet',
    color1:'#FF2D2D', color2:'#3DDC84',
    tags:['sharing','school','funny','food'],
    prompt:`Spider-Man kid on a colorful illustrated rooftop terrace lunch spot discovers his web accidentally grabbed an enormous lunch basket from a market below — sandwiches, apples, juice boxes and cookies are stuck to webs everywhere. He spots a group of tiny kids on a playground below who've dropped their lunches. Comedy sequence: he carefully lowers perfect web-wrapped lunch packages to each child with precise aim, face scrunched in concentration, tongue out. When the last sandwich lands perfectly a tiny kid gives a thumbs up and Spidey does a triumphant little dance on the rooftop. Market colors are vivid warm reds and yellows, playground is pastel green and blue. Lunch item physics, web tension animation, comedic timing. 9:16 portrait, 720p, 30 seconds, no dialogue.`
  },
  {
    num:'08', emoji:'🌙', title:'Bedtime Patrol',
    theme:'Safety & Care', mood:'Soft & Dreamy',
    color1:'#1A3FCC', color2:'#9B59FF',
    tags:['bedtime','night','dreamy','season-finale'],
    prompt:`Season finale: Spider-Man kid swings slowly and peacefully through a softly glowing nighttime city where every window shows families settling in for the evening — warm amber light spilling from cozy illustrated interiors, stars beginning to appear. He tucks a sleeping cat into a flower box, straightens a drooping lamppost flower, and returns a floating balloon back to a sleeping toddler's wrist visible through a window. Final shot: he perches atop the city's highest star-lit rooftop, pulls his tiny knees to his chest, looks up at a giant golden full moon and lets out a sleepy yawn, eyes drooping to half-mast in pure contentment. Fireflies drift past. The city glows warmly below. Dreamy slow motion, warm amber and deep blue palette, firefly particle effects. Season-finale emotional warmth. 9:16 portrait, 720p, 30 seconds, no dialogue.`
  }
];

const grid = document.getElementById('epGrid');

episodes.forEach((ep, i) => {
  const card = document.createElement('div');
  card.className = 'ep-card';
  card.innerHTML = `
    <div class="ep-top">
      <div class="ep-num-badge" style="background:linear-gradient(135deg,${ep.color1},${ep.color2})">
        ${ep.emoji}
      </div>
      <div class="ep-meta">
        <div class="ep-title">EP${ep.num} · ${ep.title}</div>
        <div class="ep-tags">
          <span class="ep-tag" style="color:${ep.color1};border:1px solid ${ep.color1}40">${ep.theme}</span>
          <span class="ep-tag" style="color:${ep.color2};border:1px solid ${ep.color2}40">${ep.mood}</span>
          ${ep.tags.map(t=>`<span class="ep-tag">#${t}</span>`).join('')}
        </div>
      </div>
    </div>
    <div class="prompt-box" id="prompt-${i}">
      ${ep.prompt}
      <div class="prompt-fade" id="fade-${i}"></div>
    </div>
    <div class="ep-actions">
      <button class="btn-expand" onclick="toggleExpand(${i})">👁 Expand</button>
      <button class="btn-copy-ep" id="btn-${i}" style="background:linear-gradient(135deg,${ep.color1},${ep.color2})" onclick="copyEp(${i})">
        📋 Copy EP${ep.num} Prompt
      </button>
    </div>
    <div class="spec-strip">
      <span class="spec-bit">🎬 Veo 3.1 Fast</span>
      <span class="spec-bit">📐 9:16</span>
      <span class="spec-bit">🎯 720p</span>
      <span class="spec-bit">⏱ 30s</span>
      <span class="spec-bit">🔊 No Dialogue</span>
      <span class="spec-bit">👶 Kids 2–7</span>
    </div>
  `;
  grid.appendChild(card);
});

function toggleExpand(i) {
  const box = document.getElementById(`prompt-${i}`);
  const fade = document.getElementById(`fade-${i}`);
  box.classList.toggle('expanded');
  const btn = box.nextElementSibling.querySelector('.btn-expand');
  btn.textContent = box.classList.contains('expanded') ? '▲ Collapse' : '👁 Expand';
}

function copyEp(i) {
  navigator.clipboard.writeText(episodes[i].prompt).then(() => {
    const btn = document.getElementById(`btn-${i}`);
    const orig = btn.textContent;
    btn.textContent = '✅ Copied!';
    btn.classList.add('copied');
    showToast(`EP${episodes[i].num} prompt copied!`);
    setTimeout(() => {
      btn.textContent = orig;
      btn.classList.remove('copied');
    }, 2000);
  });
}

function copyAll() {
  const all = episodes.map(ep =>
    `=== EP${ep.num}: ${ep.title} ===\nTheme: ${ep.theme} | Mood: ${ep.mood}\n\n${ep.prompt}`
  ).join('\n\n---\n\n');
  navigator.clipboard.writeText(all).then(() => {
    showToast('All 8 prompts copied! 🚀');
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = '✅ ' + msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
</body>
</html>
